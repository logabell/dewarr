[project]
name = "dewarr"
version = "0.3.3"
description = "Self-hosted book discovery, curation and acquisition"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0.40,<2.1",
  "psycopg[binary,pool]>=3.2,<4",
  "alembic>=1.15,<2",
  "procrastinate==3.9.0",
  "httpx>=0.28,<1",
  "argon2-cffi>=25.1,<26",
  "cryptography>=45,<47",
  "defusedxml>=0.7.1,<1",
  "pillow>=12.3,<13",
  "pypdf>=6.19,<7",
  "libtorrent==2.1.1",
  "beautifulsoup4>=4.15,<5",
  "authlib>=1.6,<2",
  "joserfc>=1.7,<2",
  "apprise>=1.9,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "pytest-timeout>=2.4,<3",
  "pytest-xdist>=3.6,<4",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/app"]

[tool.hatch.build.targets.wheel.force-include]
"docs/notices/MouseSearch-MIT.txt" = "app/notices/MouseSearch-MIT.txt"
"docs/notices/myanonamouse-mcp-MIT.txt" = "app/notices/myanonamouse-mcp-MIT.txt"
"docs/notices/libtorrent-BSD.txt" = "app/notices/libtorrent-BSD.txt"
"docs/notices/Boost-LICENSE-1.0.txt" = "app/notices/Boost-LICENSE-1.0.txt"
"docs/notices/OpenSSL-3-LICENSE.txt" = "app/notices/OpenSSL-3-LICENSE.txt"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers"
# Routine checks favor API/worker journeys. `pytest tests` explicitly runs all tests.
testpaths = [
  "tests/integration/test_auth.py",
  "tests/integration/test_queue.py",
  "tests/integration/test_download_fulfillment.py",
  "tests/unit/test_security.py",
]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
timeout_method = "thread"
faulthandler_timeout = 60
markers = ["integration: requires isolated PostgreSQL"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
