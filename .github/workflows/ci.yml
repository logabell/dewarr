name: Application checks
on:
  push:
    # Feature branches run through PRs; main/tags use Publish container.
    branches: [dev]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip-image:
        description: The release workflow builds and smoke-tests both images separately.
        type: boolean
        default: false
permissions:
  contents: read

# A newer commit supersedes checks on the same branch or pull request.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  secrets:
    uses: ./.github/workflows/secrets.yml
  backend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.3-bookworm
        env:
          POSTGRES_USER: book
          POSTGRES_PASSWORD: book-test-only
          POSTGRES_DB: book_search_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U book -d book_search_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BOOK_TEST_DATABASE_URL: postgresql+psycopg://book:book-test-only@localhost:5432/book_search_test
      BOOK_DATABASE_URL: postgresql+psycopg://book:book-test-only@localhost:5432/book_search_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Install media and PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - run: pg_dump --version && pg_restore --version
      - run: uv run ruff check services tests scripts
      - run: uv run ruff format --check services tests scripts
      - name: Check migrations on a fresh database
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code -- docs/openapi.json
      - name: Unit and contract tests
        timeout-minutes: 5
        run: >-
          uv run pytest tests/unit tests/contracts -q -n 2
          --timeout=120 --timeout-method=thread --max-worker-restart=0
          --durations=20 --junitxml=test-results/backend-checks.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-checks-evidence
          path: test-results/
  backend-integration:
    name: backend integration (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18.3-bookworm
        env:
          POSTGRES_USER: book
          POSTGRES_PASSWORD: book-test-only
          POSTGRES_DB: book_search_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U book -d book_search_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BOOK_TEST_DATABASE_URL: postgresql+psycopg://book:book-test-only@localhost:5432/book_search_test
      BOOK_DATABASE_URL: postgresql+psycopg://book:book-test-only@localhost:5432/book_search_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Install media and PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - run: pg_dump --version && pg_restore --version
      - name: Integration tests
        timeout-minutes: 10
        run: >-
          uv run pytest tests/integration -q -n 2 --dist=worksteal
          -p scripts.pytest_shard --ci-shard=${{ matrix.shard }}/4
          --timeout=120 --timeout-method=thread --max-worker-restart=0
          --durations=25 --junitxml=test-results/backend-${{ matrix.shard }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-integration-${{ matrix.shard }}-evidence
          path: test-results/
  # Preserve the backend status-check name for branch protection.
  backend:
    if: always()
    needs: [backend-checks, backend-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all backend checks
        env:
          CHECKS_RESULT: ${{ needs.backend-checks.result }}
          INTEGRATION_RESULT: ${{ needs.backend-integration.result }}
        run: test "$CHECKS_RESULT" = success && test "$INTEGRATION_RESULT" = success
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run generate:api
      - run: git diff --exit-code -- src/api/schema.d.ts
      - run: npm run build
      - run: npm run format:check
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.3-bookworm
        env:
          POSTGRES_USER: book
          POSTGRES_PASSWORD: book-test-only
          POSTGRES_DB: book_search_browser_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U book -d book_search_browser_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BOOK_E2E_DATABASE_URL: postgresql+psycopg://book:book-test-only@localhost:5432/book_search_browser_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --frozen
      - name: Install media and PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - run: pg_dump --version && pg_restore --version
      - run: npm --prefix apps/web ci
      - run: cd apps/web && npx playwright install --with-deps chromium
      - run: npm --prefix apps/web run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: apps/web/test-results/
  image:
    if: ${{ !inputs.skip-image }}
    uses: ./.github/workflows/image.yml
