name: Publish container
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      reuse-run-id: ${{ steps.plan.outputs.reuse-run-id }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve checked candidate
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release.py plan
  checks:
    needs: plan
    if: needs.plan.outputs.reuse-run-id == ''
    uses: ./.github/workflows/ci.yml
    with:
      skip-image: true
  image:
    needs: plan
    if: needs.plan.outputs.reuse-run-id == ''
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      publish: true
  publish:
    needs: [plan, checks, image]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      ((needs.plan.outputs.reuse-run-id != '' && needs.checks.result == 'skipped' && needs.image.result == 'skipped') ||
       (needs.checks.result == 'success' && needs.image.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only final channel updates are serialized; checks/builds remain parallel.
    concurrency:
      group: container-release-channels
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download checked main candidate
        if: needs.plan.outputs.reuse-run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: candidate
          run-id: ${{ needs.plan.outputs.reuse-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download tested architecture digests
        if: needs.plan.outputs.reuse-run-id == ''
        uses: actions/download-artifact@v4
        with:
          pattern: container-digest-*
          path: digests
          merge-multiple: true
      - name: Assemble checked image
        if: needs.plan.outputs.reuse-run-id == ''
        run: python3 scripts/release.py assemble
      - name: Promote immutable candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release.py publish
      - name: Save checked candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: candidate/candidate.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
