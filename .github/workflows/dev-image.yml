name: Publish dev image
run-name: Dev image · ${{ inputs.ref }} · ${{ inputs.arch }}
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Pushed branch or commit to test (no release required)
        type: string
        default: dev
        required: true
      arch:
        description: Homelab architecture (amd64 for Intel/AMD, arm64 for ARM)
        type: choice
        options: [amd64, arm64]
        default: amd64
        required: true
permissions:
  contents: read

# One homelab channel: a newer manual build supersedes an unfinished one.
concurrency:
  group: container-dev-channel
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:18.3-bookworm
        env:
          POSTGRES_USER: book
          POSTGRES_PASSWORD: book-test-only
          POSTGRES_DB: container_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U book -d container_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Identify dev build
        id: identity
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          python3 - <<'PY'
          import os, subprocess, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          run = os.environ["GITHUB_RUN_ID"] + "." + os.environ["GITHUB_RUN_ATTEMPT"]
          image = "ghcr.io/" + os.environ["GITHUB_REPOSITORY"].lower()
          build = f"{version}-dev.{run}+{sha[:12]}"
          tag = f"dev-{sha[:12]}-{run}-{os.environ['ARCH']}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"image={image}\nversion={build}\nsha={sha}\ntag={tag}\n")
          PY
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build cached image for the homelab
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ inputs.arch }}
          load: true
          tags: dewarr:dev-candidate
          provenance: false
          build-args: |
            BOOK_BUILD_VERSION=${{ steps.identity.outputs.version }}
            BOOK_RELEASE_REPOSITORY=${{ github.repository }}
          labels: |
            org.opencontainers.image.revision=${{ steps.identity.outputs.sha }}
            org.opencontainers.image.version=${{ steps.identity.outputs.version }}
          cache-from: |
            type=gha,scope=dewarr-dev-${{ inputs.arch }}
            type=gha,scope=dewarr-${{ inputs.arch }}
          cache-to: type=gha,scope=dewarr-dev-${{ inputs.arch }},mode=max,ignore-error=true,timeout=2m
      - name: Check startup, migrations, and bundled UI
        env:
          IMAGE: dewarr:dev-candidate
          EXPECTED_VERSION: ${{ steps.identity.outputs.version }}
          EXPECTED_ARCH: ${{ inputs.arch }}
        run: bash scripts/smoke_image.sh
      - name: Publish checked dev build
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          TAG: ${{ steps.identity.outputs.tag }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          docker tag dewarr:dev-candidate "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          docker tag dewarr:dev-candidate "$IMAGE:dev"
          docker push "$IMAGE:dev"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          Built **$VERSION**. Startup, migrations, and bundled UI passed; full application CI was skipped.

          Homelab channel: \`$IMAGE:dev\`

          Specific build: \`$IMAGE:$TAG\`

          Update only Dewarr in your existing stack:
          \`docker compose up -d --no-deps --pull always --wait dewarr\`
          EOF
