name: Secret scan
on:
  workflow_call:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt --output checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan public source files
        run: |
          mkdir "$RUNNER_TEMP/dewarr-public"
          git archive HEAD | tar -xf - -C "$RUNNER_TEMP/dewarr-public"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/dewarr-public" --redact --no-banner
