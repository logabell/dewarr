name: Container images
on:
  workflow_call:
    inputs:
      publish:
        description: Upload untagged candidate images; release channels are updated after all checks.
        type: boolean
        default: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18.3-bookworm
        env:
          POSTGRES_USER: book
          POSTGRES_PASSWORD: book-test-only
          POSTGRES_DB: container_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U book -d container_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        id: version
        run: python3 scripts/release.py version
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: ${{ !inputs.publish }}
          outputs: ${{ inputs.publish && format('type=image,name=ghcr.io/{0},push-by-digest=true,name-canonical=true,push=true', github.repository) || '' }}
          tags: ${{ !inputs.publish && 'dewarr:ci' || '' }}
          provenance: ${{ inputs.publish && 'mode=max' || 'false' }}
          build-args: |
            BOOK_BUILD_VERSION=${{ steps.version.outputs.version }}
            BOOK_RELEASE_REPOSITORY=${{ github.repository }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=dewarr-${{ matrix.arch }}
          cache-to: type=gha,scope=dewarr-${{ matrix.arch }},mode=max
      - name: Smoke-test final image
        env:
          IMAGE: ${{ inputs.publish && format('ghcr.io/{0}@{1}', github.repository, steps.build.outputs.digest) || 'dewarr:ci' }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: bash scripts/smoke_image.sh
      - name: Record tested digest
        if: inputs.publish
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/$ARCH.txt"
      - uses: actions/upload-artifact@v4
        if: inputs.publish
        with:
          name: container-digest-${{ matrix.arch }}
          path: digests/*.txt
          if-no-files-found: error
          retention-days: 1
          overwrite: true
